name: Deploy MVP to GitHub Pages

# Click-through demo only -- this builds src/ against its seed.js mock
# data (no real API/database involved, see src/context/AppContext.jsx),
# so it's safe to publish from a public repo. Manual dispatch is included
# since this only needs to run when someone wants to refresh the demo,
# not on every push.
on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      # GitHub Pages has no server-side rewrite rule (unlike
      # frontend/nginx.conf's try_files), so a direct load/refresh of a
      # react-router-dom route like /browse would 404. Pages does fall
      # back to 404.html on any unmatched path, so a copy of index.html
      # there hands the request back to the SPA, which then renders the
      # right route client-side.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
