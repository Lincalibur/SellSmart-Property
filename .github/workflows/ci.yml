name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Emulates S3 (issue #8) and SES (issue #11) -- same reasoning as the
      # real Postgres above: the RLS/access-control layer is worth testing
      # for real, not mocking. Object Lock itself is a bucket-level default
      # set in terraform/modules/storage, not something the app configures
      # per request, so LocalStack's community S3 support (no Object Lock)
      # is enough to exercise the actual upload/confirm/download code path;
      # same idea for SES -- community support covers SendEmailCommand and
      # listing what was sent, which is all api/src/lib/email.js needs.
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3,sesv2
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Non-superuser, owns everything it migrates -- mirrors the Aurora
      # master user in production (see db/migrations/0006_listings_force_rls.sql)
      # so RLS is actually exercised, not silently bypassed by a superuser.
      DATABASE_URL: postgres://app_test:app_test@localhost:5432/sellsmart_test
      # The postgres:16 service image doesn't have SSL configured; pool.js
      # defaults to requiring it, so this is needed for every connection,
      # including scripts/migrate.js, to succeed.
      DATABASE_SSL: "false"
      S3_ENDPOINT: http://localhost:4566
      DOCUMENTS_BUCKET: sellsmart-property-documents-test
      SES_ENDPOINT: http://localhost:4566
      EMAIL_FROM: no-reply@sellsmartproperty.example
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: af-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Create non-superuser app role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sellsmart_test -c \
            "CREATE ROLE app_test LOGIN PASSWORD 'app_test'; ALTER DATABASE sellsmart_test OWNER TO app_test; GRANT ALL ON SCHEMA public TO app_test;"

      - name: Create S3 bucket in LocalStack
        run: aws --endpoint-url=http://localhost:4566 s3 mb s3://sellsmart-property-documents-test

      - run: node scripts/migrate.js
      - run: npm test
