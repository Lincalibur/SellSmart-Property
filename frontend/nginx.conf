server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The build has no inline scripts/styles (dist/index.html only
    # references hashed /assets/* files), so CSP can stay this tight
    # without a 'nonce'/'unsafe-inline' escape hatch. img-src allows data:
    # for the few inlined SVG icons (src/components/icons.jsx).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback -- react-router-dom owns client-side routing, so every
    # route needs to resolve to index.html rather than 404ing on a direct
    # load/refresh of e.g. /listing/1.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
