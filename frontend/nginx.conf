server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- react-router-dom owns client-side routing, so every
    # route needs to resolve to index.html rather than 404ing on a direct
    # load/refresh of e.g. /listing/1.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
